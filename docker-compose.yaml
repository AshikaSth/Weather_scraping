x-shared: &shared
  image: weather_app_base:latest
  build: .
  working_dir: /app
  env_file:
    - .env
  environment:
    PYTHONPATH: /app
    TZ: Asia/Kathmandu
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:

  celery_worker:
    <<: *shared
    command: celery -A app.tasks:celery_app worker --loglevel=info
    volumes:
      - .:/app

  celery_beat:
    <<: *shared
    command: celery -A app.tasks:celery_app beat --loglevel=info
    volumes:
      - .:/app

  web_dashboard:
    <<: *shared
    command: python3 app/main.py
    ports:
      - "2222:5000"
    volumes:
      - .:/app

  db:
    image: postgres:16
    restart: always
    volumes:
      - postgresql_data:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "3330:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backup:/backup

    entrypoint: >
      sh -c "
      while true; do
        DATE=$$(date +%F_%H-%M-%S);
        echo 'Running backup for database: $$DATE';

        PGPASSWORD=$$POSTGRES_PASSWORD pg_dump
        -h db
        -U $$POSTGRES_USER
        $$POSTGRES_DB
        > /backup/backup_$$DATE.sql;

        find /backup -type f -mtime +7 -delete;

        sleep 3600;
      done
      "

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    image: redis:alpine
    restart: always

volumes:
  postgresql_data:

networks:
  app_network: